name: Cross-platform CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} (Debug + Release)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc14
            preset: linux
            cc: gcc-14
            cxx: g++-14
            triplet: x64-linux
          - os: ubuntu-24.04
            compiler: clang18
            preset: linux
            cc: clang-18
            cxx: clang++-18
            triplet: x64-linux
          - os: windows-2025
            compiler: msvc
            preset: windows
            cc: cl
            cxx: cl
            triplet: x64-windows
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VCPKG_MAX_CONCURRENCY: 2
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 clang-18 ninja-build pkg-config \
            autoconf autoconf-archive automake libtool gperf \
            bison flex gettext nasm python3-pip python3-venv \
            curl zip unzip tar libltdl-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libx11-dev libxext-dev libxft-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libibus-1.0-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev libdrm-dev libgbm-dev libdecor-0-dev

      - name: Configure MSVC x64
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Prepare toolchain and cache paths
        id: setup
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = (Get-Content vcpkg-tool-revision.txt -Raw).Trim()
          if ($revision -notmatch '^[0-9a-fA-F]{40}$') { throw 'Invalid vcpkg revision' }
          $root = (Join-Path $env:RUNNER_TEMP 'thj-vcpkg').Replace('\', '/')
          $cache = (Join-Path $env:RUNNER_TEMP 'thj-vcpkg-cache').Replace('\', '/')
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite" >> $env:GITHUB_ENV
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ninja --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            (Get-Item (Get-Command cl).Source).VersionInfo.FileVersion
          } else {
            & $env:CXX --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Restore vcpkg binary cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/thj-vcpkg-cache
          key: thj-v1-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.triplet }}-${{ steps.setup.outputs.image }}-${{ hashFiles('vcpkg.json', 'vcpkg-tool-revision.txt', 'CMakePresets.json') }}
          restore-keys: |
            thj-v1-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.triplet }}-

      - name: Bootstrap pinned vcpkg
        env:
          THJ_VCPKG_REVISION: ${{ steps.setup.outputs.revision }}
        run: |
          git clone --no-checkout https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:VCPKG_ROOT" checkout --detach "$env:THJ_VCPKG_REVISION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($IsWindows) {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          } else {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure, build and test Debug
        env:
          THJ_PRESET: ${{ matrix.preset }}-debug
        run: |
          cmake --preset $env:THJ_PRESET -DTHJ_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $env:THJ_PRESET --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset $env:THJ_PRESET --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure, build and test Release
        env:
          THJ_PRESET: ${{ matrix.preset }}-release
        run: |
          cmake --preset $env:THJ_PRESET -DTHJ_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $env:THJ_PRESET --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset $env:THJ_PRESET --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Linux CI executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thj-${{ matrix.compiler }}-release
          path: build/linux-release/thj_client
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows CI executable and app-local DLLs
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thj-msvc-release
          path: |
            build/windows-release/thj_client.exe
            build/windows-release/*.dll
          if-no-files-found: error
          retention-days: 7

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thj-${{ matrix.compiler }}-test-logs
          path: build/*/Testing/Temporary/*.log
          if-no-files-found: ignore
          retention-days: 7
